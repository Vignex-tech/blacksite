name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            Tests/package-lock.json

      - name: Client - install
        working-directory: client
        run: npm ci

      - name: Client - build
        working-directory: client
        run: npm run build

      - name: Server - install
        working-directory: server
        run: npm ci

      - name: Server - build
        working-directory: server
        run: npm run build

      # Mocha runs through tsx, which never type-checks the tests, so check
      # server/test (and src) here (#37).
      - name: Server - type-check (tsc --noEmit)
        working-directory: server
        run: npx tsc --noEmit

      - name: Server - test (Mocha)
        working-directory: server
        run: npm test

      - name: Tests - install
        working-directory: Tests
        run: npm ci

      - name: Tests - unit (Vitest)
        working-directory: Tests
        run: npm run test:unit


  # The e2e suite runs as three parallel shards, each with its own built server
  # (#65). Wall time is the slowest shard. Shards are defined in
  # Tests/scripts/e2e-shard.mjs; every spec belongs to exactly one.
  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        shard: [integration, browser-a, browser-b]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            Tests/package-lock.json

      - name: Client - install and build
        working-directory: client
        run: npm ci && npm run build

      - name: Server - install and build
        working-directory: server
        run: npm ci && npm run build

      - name: Tests - install
        working-directory: Tests
        run: npm ci

      - name: Tests - install Playwright Chromium
        if: matrix.shard != 'integration'
        working-directory: Tests
        run: npx playwright install --with-deps chromium

      # Playwright starts the built Colyseus server (server/build), which serves
      # client/dist on port 2567, so both builds above must run first.
      - name: Tests - e2e (Playwright, against the real server)
        working-directory: Tests
        run: npm run test:e2e:shard -- ${{ matrix.shard }}

      # Screenshots from e2e/map.spec.ts, m4-gate.spec.ts and upper-level.spec.ts,
      # for a human to look at; no test compares their pixels.
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: Tests/Reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: Tests/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # The one required check: fails if the checks job or any e2e shard failed,
  # was cancelled or was skipped.
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: ${{ always() }}
    steps:
      - name: All jobs succeeded
        run: |
          echo "checks: ${{ needs.checks.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.checks.result }}" = success && test "${{ needs.e2e.result }}" = success
