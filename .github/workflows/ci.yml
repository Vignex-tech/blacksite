name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            Tests/package-lock.json

      - name: Client - install
        working-directory: client
        run: npm ci

      - name: Client - build
        working-directory: client
        run: npm run build

      - name: Server - install
        working-directory: server
        run: npm ci

      - name: Server - build
        working-directory: server
        run: npm run build

      - name: Server - test (Mocha)
        working-directory: server
        run: npm test

      - name: Tests - install
        working-directory: Tests
        run: npm ci

      - name: Tests - unit (Vitest)
        working-directory: Tests
        run: npm run test:unit

      - name: Tests - install Playwright Chromium
        working-directory: Tests
        run: npx playwright install --with-deps chromium

      # Playwright starts the built Colyseus server (server/build), which serves
      # client/dist on port 2567, so both builds above must run first.
      - name: Tests - e2e (Playwright, against the real server)
        working-directory: Tests
        run: npm run test:e2e

      # Screenshots from e2e/map.spec.ts, for a human to look at: the whole map
      # from the overhead camera (graybox-map.png) and the ghost's third-person
      # and the warden's first-person views (#25), and from e2e/upper-level.spec.ts
      # the warden's view of a ghost hanging from a ledge and of a warden on the
      # upper level above the stairs (#34), and from e2e/m4-gate.spec.ts the
      # ghost's third-person view while hanging from ledge-west-wall (#36).
      # Uploaded on every run; no test compares their pixels.
      - name: Upload map screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: graybox-map-screenshot
          path: Tests/Reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Tests/playwright-report
          if-no-files-found: ignore
          retention-days: 14
